									<div class="mb-3 col-12 col-md-6 sr_bottom">

										<input type="text" class="form-control maskable-field" id="address" placeholder="請輸入地址" value="台北市信義區***路*" data-masked="台北市信義區***路*" data-original="台北市信義區基隆路一段" readonly>
									</div>

		<!-- Modal start-->
		<!-- 密碼確認-->
		<div class="modal fade" id="passwordModal" tabindex="-1" aria-labelledby="passwordModalLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<div class="modal-title" id="passwordModalLabel">身分驗證</div>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<div class="mb-3">
							<label for="checkPassword" class="form-label">請輸入會員密碼以檢視/修改完整資料：</label>
							<input type="password" class="form-control" id="checkPassword" placeholder="請輸入密碼(預設123456)">
							<div id="passwordError" class="finvalid-feedback">密碼錯誤，請重新輸入</div>
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
						<button type="button" class="btn btn-primary" id="btnSubmitPassword">確認</button>
					</div>
				</div>
			</div>
		</div>
		<!-- Modal end-->

		<script>
			let inactivityTimer = null;
			const TIMEOUT_DURATION = 5 * 60 * 1000; // 5分鐘 (毫秒)

			// 1. 點擊「檢視修改」時，開啟密碼驗證 Modal
			$('#btnEditMode').on('click', function() {
				$('#checkPassword').val('');
				$('#passwordError').hide();
				var myModal = new bootstrap.Modal(document.getElementById('passwordModal'));
				myModal.show();
			});

			// 2. 密碼確認送出
			$('#btnSubmitPassword').on('click', function() {
				const pwd = $('#checkPassword').val();
				
				if (pwd === "123456") { // 假設正確密碼為 "123456"
					var modalEl = document.getElementById('passwordModal');
					var modal = bootstrap.Modal.getInstance(modalEl);
					modal.hide();
					
					enableEditableMode();
					resetInactivityTimer();
					
				} else {
					$('#passwordError').show();
				}
			});

			// 3. 切換為「編輯/完整檢視」狀態
			function enableEditableMode() {
				$('.maskable-field').each(function() {
					$(this).val($(this).attr('data-original'));
					$(this).prop('readonly', false);
				});
				
				$('#educational, #city').prop('disabled', false);
				$('#genderGroup input').prop('disabled', false);
				$('.edit-hidden-item').show();
				
				$('#btnEditMode').hide();
				$('#btnSave, #btnCancel').show();
			}

			// 4. 切換回「隱碼唯讀」狀態（透過參數控制是否顯示超時警告）
			function resetToMaskedMode(showAlert = true) {
				clearTimeout(inactivityTimer);
				
				$('.maskable-field').each(function() {
					$(this).val($(this).attr('data-masked'));
					$(this).prop('readonly', true);
				});
				
				$('#educational, #city').prop('disabled', true);
				$('#genderGroup input').prop('disabled', true);
				$('.edit-hidden-item').hide();
				
				$('#btnSave, #btnCancel, #btnEditMode').hide();
				$('#btnEditMode').show();
				
				// 只有在真正因「閒置超時」觸發時才跳出警告
				if (showAlert) {
					alert('已超過 5 分鐘無操作，為保障帳號安全，已自動恢復隱碼狀態。');
				}
			}

			// 5. 5分鐘計時器重置機制
			function resetInactivityTimer() {
				clearTimeout(inactivityTimer);
				inactivityTimer = setTimeout(function() {
					resetToMaskedMode(true); // 閒置超時：顯示警告
				}, TIMEOUT_DURATION);
			}

			// 監聽使用者動作以重置計時器
			$(document).on('mousemove keypress click', function() {
				if ($('#btnSave').is(':visible')) {
					resetInactivityTimer();
				}
			});

			// 6. 點擊取消按鈕
			$('#btnCancel').on('click', function() {
				resetToMaskedMode(false); // 取消操作：不顯示超時警告
			});

			// 7. 點擊儲存按鈕
			$('#memberForm').on('submit', function(e) {
				e.preventDefault(); 
				clearTimeout(inactivityTimer);

				const formData = {
					username: $('#username').val(),
					email: $('#email').val(),
					phone: $('#phone').val(),
					gender: $('input[name="gender"]:checked').val(),
					birthday: $('#birthday').val(),
					educational: $('#educational').val(),
					city: $('#city').val(),
					address: $('#address').val()
				};

				console.log("正在送出資料到後端...", formData);
				
				setTimeout(function() {
					// 更新畫面上欄位的 data-original 與 data-masked
					$('#username').attr('data-original', formData.username);
					$('#username').attr('data-masked', maskUsername(formData.username)); 

					$('#email').attr('data-original', formData.email);
					$('#email').attr('data-masked', maskEmail(formData.email));
					
					$('#phone').attr('data-original', formData.phone);
					$('#phone').attr('data-masked', maskPhone(formData.phone));

					// 提示儲存成功
					alert('資料儲存成功！');
					
					// 恢復隱碼狀態，且不顯示 5 分鐘超時警告 (傳入 false)
					resetToMaskedMode(false);

				}, 500); 
			});

			// 前端隱碼輔助函式
			function maskUsername(name) {
				if (!name) return '';
				if (name.length === 2) return name[0] + '○';
				if (name.length > 2) return name[0] + '○' + name.slice(2);
				return name;
			}
			function maskEmail(email) {
				if (!email) return '';
				const parts = email.split('@');
				if (parts[0].length <= 3) return parts[0] + '***@' + parts[1];
				return parts[0].slice(0, 3) + '***@' + parts[1];
			}
			function maskPhone(phone) {
				if (!phone) return '';
				if (phone.length < 10) return phone;
				return phone.slice(0, 4) + '***' + phone.slice(7);
			}
		</script>
		
	</body>
