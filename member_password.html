<!DOCTYPE html>
<html lang="zh-hant-tw" xml:lang="zh-hant-tw">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
		<title>TaiPlay旅遊行程規劃平台</title>
		<link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon" />
		<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
		<meta http-equiv="Cache-Control" content="private,no-cache">	
		<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no">
		<meta name="format-detection" content="telephone=no">
		<meta name="format-detection" content="email=no">
		<meta name="format-detection" content="adress=no">

		<link rel="stylesheet" href="css/bootstrap.min.css">
		<link rel="stylesheet" href="css/theme.css">
		<link rel="stylesheet" href="css/theme-elements.css">
		<link rel="stylesheet" href="scss/style.css">
		
		<!--font icon-->
		<link rel="stylesheet" href="css/all.min.css">
		<link rel="stylesheet" href="css/fontawesome.min.css">

		<script src="js/jquery.min.js"></script>
		<script src="js/main.js"></script>	

	</head>
	<body>
		
		<!--header start-->
		<script>$.include("blocks/header.html");</script>
		<!--header end-->

		<div role="main" class="main">

			<!--page_banner start--><!--建議尺寸1920*300px-->
			<div class="page_banner">
				<h2 class="sr_top">密碼變更</h2>
			</div>
			<!--page_banner end-->

			<!--breadcrumb end-->
			<div class="breadcrumb_box">
				<nav aria-label="breadcrumb" class="container">
					<ol class="breadcrumb">
						<li class="breadcrumb-item"><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
						<li class="breadcrumb-item">會員管理</li>
						<li class="breadcrumb-item active">密碼變更</li>
					</ol>
				</nav>
			</div>
			<!--breadcrumb end-->

			<!--main_con start-->
			<div class="main_con">
				<div class="container margin_auto">
					
					<div class="member_box">
						<div class="menu">

							<div class="user_box">
								<div class="img">
									<img src="img/300x300.png"  alt="" style="background-image: url(img/customer/member_pic.jpg); background-position: center center; background-size: cover;">
								</div>
								<div class="title">王小明</div>
								<div class="mail">test@serive.com</div>
							</div>

							<div class="user_total">
								<div class="item">
									<div class="quantity">12</div>
									<div class="title">收藏景點</div>
								</div>
								<div class="item">
									<div class="quantity">2</div>
									<div class="title">規劃行程</div>
								</div>
							</div>

							<hr>

							<aside>
								<a href="member_edit.html">基本資料</a>
								<a href="member_favorite.html">收藏清單</a>
								<a href="member_trip.html">行程管理</a>
								<a href="member_password.html" class="active">密碼變更</a>
								<hr>
								<a href="login.html" class="logout">登出</a>
							</aside>

						</div>
						<div class="con">
							
							<form>
								<div class="row">

									<div class="mb-3 col-12 sr_bottom">
										<label for="password" class="form-label required">原密碼</label>
										<div class="show_hide_password">
											<input type="password" class="form-control" id="password" placeholder="至少 8 位英數組合">
											<i class="fa-regular fa-eye-slash password_eye" aria-hidden="true"></i>
										</div>
										<!-- <div id="passwordHelp" class="finvalid-feedback">至少 8 位英數組合</div> -->
									</div>

									<div class="mb-3 col-12 sr_bottom">
										<label for="newpassword" class="form-label required">新密碼</label>
										<div class="show_hide_password">
											<input type="password" class="form-control" id="newpassword" placeholder="至少 8 位英數組合">
											<i class="fa-regular fa-eye-slash password_eye" aria-hidden="true"></i>
										</div>
										<!-- <div id="newpasswordHelp" class="finvalid-feedback">至少 8 位英數組合</div> -->
									</div>

									<div class="mb-3 col-12 sr_bottom">
										<label for="password2" class="form-label required">確認密碼</label>
										<div class="show_hide_password">
											<input type="password" class="form-control" id="password2" placeholder="請再次輸入新密碼">
											<i class="fa-regular fa-eye-slash password_eye" aria-hidden="true"></i>
										</div>
										<!-- <div id="password2Help" class="finvalid-feedback">請再次輸入新密碼</div> -->
									</div>
								</div>

								<div class="btn_box text-center sr_bottom">
									<button type="button" class="btn btn_01" data-bs-toggle="modal" data-bs-target="#ok_modal">儲存</button>
								</div>

							</form>
						</div>
					</div>
				</div>
			</div>
			<!--main_con end-->

		</div>
		
		<!--footer start-->
		<script>$.include("blocks/footer.html");</script>
		<!--footer end-->

		<script src="js/jquery.min.js"></script>
		<script src="js/jquery.appear.min.js"></script>
		<script src="js/jquery.easing.min.js"></script>
		<script src="js/jquery.visible.min.js"></script>
		<script src="js/bootstrap.bundle.min.js"></script>
		
		<script src="js/theme.js"></script>
		<script src="js/theme.init.js"></script>

		<!--滾動效果 start-->
		<script src="js/scrollreveal.min.js"></script>
		<!--滾動效果 end-->

		<!-- Modal start-->
		<div class="modal fade" id="ok_modal" tabindex="-1" aria-labelledby="ok_label" aria-hidden="true">
			<div class="modal-dialog modal-dialog-centered">
				<div class="modal-content">
					<div class="modal-header">
						<div class="modal-title" id="edit_label">密碼變更</div>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						已修改儲存完成。
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-primary" data-bs-dismiss="modal">確認</button>
					</div>
				</div>
			</div>
		</div>
		<!-- Modal end-->
		
	</body>
</html>
