<script>
    // $(function () {
    //     $("#header").removeAttr("style"); 
    //     $(".header-logo").removeAttr("style"); 
    // });
    document.addEventListener('DOMContentLoaded', function() {
    const buttons = document.querySelectorAll('.toggle-btn');

    buttons.forEach(button => {
        button.addEventListener('click', function() {
            const targetSelector = this.getAttribute('data-target');
            const targetNav = document.querySelector(targetSelector);
            
            // 檢查當前目標是否已經是展開狀態
            const isOpen = targetNav.classList.contains('show');

            // 1. 將所有相關選單全部關閉（統一加上 closed，移除 show）
            buttons.forEach(btn => {
                const sel = btn.getAttribute('data-target');
                const nav = document.querySelector(sel);
                if (nav) {
                    nav.classList.remove('show');
                    nav.classList.add('closed');
                }
            });

            // 2. 如果剛剛點擊的原本是關閉的，就將它展開；如果是開啟的則維持關閉
            if (!isOpen) {
                targetNav.classList.remove('closed');
                targetNav.classList.add('show');
            }
        });
    });
});
</script>
